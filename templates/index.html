<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>טריוויה - שליטה מלאה במפעיל</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap');
        body { font-family: 'Rubik', sans-serif; background: radial-gradient(circle at center, #ff7b00 0%, #c41e00 70%, #6b0000 100%); margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #333; }
        .stage-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(#ffe100 15%, transparent 16%), radial-gradient(#ffe100 15%, transparent 16%); background-size: 60px 60px; background-position: 0 0, 30px 30px; opacity: 0.15; z-index: -1; }
        
        .pause-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; color: white; font-size: 6rem; font-weight: 900; letter-spacing: 5px; }

        .lobby-screen { display: none; text-align: center; width: 95%; max-width: 1200px; z-index: 5; }
        .lobby-title { font-size: 4rem; color: #fffac9; text-shadow: 0 5px 10px rgba(0,0,0,0.5); margin-bottom: 20px; font-weight: 900; }
        .players-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 30px; }
        .player-badge { background: #2ecc71; color: white; padding: 15px 25px; border-radius: 50px; font-size: 1.8rem; font-weight: bold; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .game-board { display: none; width: 90%; max-width: 1100px; flex-direction: column; gap: 20px; position: relative; z-index: 5; }
        .question-box { background-color: #fffac9; border: 4px solid #333; border-radius: 25px; padding: 30px; text-align: center; box-shadow: 0 10px 0px rgba(0,0,0,0.2); position: relative; }
        .question-text { font-size: 3rem; font-weight: 900; color: #4a3b2c; margin: 0; }
        
        .indicator-lights { position: absolute; top: -20px; left: 40px; background: #fffac9; border: 4px solid #333; border-radius: 20px; padding: 5px 15px; display: flex; gap: 10px; box-shadow: 0 5px 0px rgba(0,0,0,0.2); }
        .light { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #333; background-color: #555; opacity: 0.3; }
        .light.green-on { background-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; opacity: 1; }
        .light.red-on { background-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; opacity: 1; }

        .answers-grid { display: flex; justify-content: center; gap: 15px; }
        .answer-box { flex: 1; background-color: #fffac9; border: 4px solid #333; border-radius: 20px; height: 150px; position: relative; overflow: hidden; box-shadow: 0 8px 0px rgba(0,0,0,0.2); transition: all 0.5s; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .water-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(52, 152, 219, 0.4); transition: height 0.5s ease-out; z-index: 1; }
        .answer-content { position: relative; z-index: 2; text-align: center; width: 100%; }
        .answer-text { font-size: 2rem; font-weight: 700; color: #4a3b2c; }
        .answer-pct { font-size: 1.5rem; font-weight: bold; color: #2980b9; margin-top: 5px; }
        .answer-number { position: absolute; bottom: 5px; right: 10px; font-size: 2.5rem; font-weight: 900; color: #333; opacity: 0.3; z-index: 2; }
        
        .correct-answer { background-color: #d4edda; border-color: #28a745; transform: scale(1.05); box-shadow: 0 0 20px #28a745; }
        .correct-answer .water-fill { background: rgba(40, 167, 69, 0.4); }
        .correct-answer .answer-pct::after { content: " ✔️"; font-size: 2rem; }

        .round-winners { display: none; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 15px; text-align: center; border: 3px solid #f39c12; margin-top: 10px; }
        .round-winners h3 { margin: 0 0 10px 0; color: #c41e00; }
        .winners-list { display: flex; justify-content: center; gap: 30px; font-size: 1.8rem; font-weight: bold; }
        
        .global-leaderboard { display: none; background-color: #fffac9; border: 4px solid #333; border-radius: 20px; padding: 40px; text-align: center; width: 80%; max-width: 800px; z-index: 5; }
        .global-leaderboard h2 { font-size: 3.5rem; color: #c41e00; margin-top: 0; }
        .global-leaderboard table { width: 100%; font-size: 2rem; font-weight: bold; text-align: center; border-collapse: collapse; }
        .global-leaderboard th { padding: 10px; background-color: #f39c12; color: white; }
        .global-leaderboard td { padding: 10px; border-bottom: 2px solid #ccc; }

        .footer-panel { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .circle-widget { width: 100px; height: 100px; border-radius: 50%; border: 4px solid white; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-weight: 900; font-size: 3rem; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .timer-circle { background-color: #e81e3a; }
        .players-circle { background-color: #f39c12; font-size: 2.5rem; }
    </style>
</head>
<body>

    <audio id="bg-music" src="/static/music.mp3" loop></audio>
    <audio id="beep-sound" src="/static/beep.mp3"></audio>

    <div class="stage-bg"></div>
    <div id="pause-overlay" class="pause-overlay">המשחק מושהה</div>

    <div id="lobby-screen" class="lobby-screen">
        <div class="lobby-title">ברוכים הבאים לטריוויה!</div>
        <div style="font-size: 2.5rem; color: white;">ממתינים להתחברות המשתתפים... (<span id="lobby-count">0</span>)</div>
        <div id="lobby-players" class="players-grid"></div>
        <div style="margin-top: 40px; color: yellow; font-size: 1.5rem;">[לחץ על חץ ימינה במקלדת כדי להתחיל | מקש R להפעלה מחדש]</div>
    </div>

    <div id="game-board" class="game-board">
        <div class="question-box">
            <div class="indicator-lights">
                <div id="green-light" class="light"></div>
                <div id="red-light" class="light"></div>
            </div>
            <h1 id="question-text" class="question-text">טוען...</h1>
            <div style="color:#e74c3c; font-weight:bold; margin-top:10px;" id="q-counter">שאלה 1</div>
        </div>

        <div class="answers-grid">
            <div class="answer-box" id="box-1"><div class="water-fill" id="fill-1"></div><div class="answer-content"><div id="opt-1" class="answer-text">...</div><div id="pct-1" class="answer-pct">0%</div></div><div class="answer-number">1</div></div>
            <div class="answer-box" id="box-2"><div class="water-fill" id="fill-2"></div><div class="answer-content"><div id="opt-2" class="answer-text">...</div><div id="pct-2" class="answer-pct">0%</div></div><div class="answer-number">2</div></div>
            <div class="answer-box" id="box-3"><div class="water-fill" id="fill-3"></div><div class="answer-content"><div id="opt-3" class="answer-text">...</div><div id="pct-3" class="answer-pct">0%</div></div><div class="answer-number">3</div></div>
            <div class="answer-box" id="box-4"><div class="water-fill" id="fill-4"></div><div class="answer-content"><div id="opt-4" class="answer-text">...</div><div id="pct-4" class="answer-pct">0%</div></div><div class="answer-number">4</div></div>
        </div>

        <div id="round-winners" class="round-winners">
            <h3>⚡ העונים המהירים ביותר בשאלה זו ⚡</h3>
            <div id="round-winners-list" class="winners-list"></div>
        </div>

        <div class="footer-panel">
            <div id="timer-display" class="circle-widget timer-circle">30</div>
            <div class="circle-widget players-circle">
                <div style="font-size: 1.5rem; margin-bottom: -5px;">👥</div>
                <div id="player-count">0</div>
            </div>
        </div>
    </div>

    <div id="global-leaderboard" class="global-leaderboard">
        <h2 id="gl-title">🏆 מובילים עד כה 🏆</h2>
        <table id="gl-table"></table>
        <div style="margin-top: 30px; color: #7f8c8d; font-size: 1.2rem;">[לחץ על חץ ימינה כדי להמשיך | מקש R להפעלה מחדש]</div>
    </div>

    <script>
        let currentState = "";
        let currentQuestionAnswer = "1";
        let isPaused = false;
        let timeRemaining = 0;

        // השעון הפנימי - סופר לאחור רק כשהשאלה פעילה בזמן אמת
        setInterval(() => {
            if (isPaused) return; 
            
            if (currentState === 'active') {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    document.getElementById('timer-display').innerText = timeRemaining;
                    
                    if (timeRemaining === 0) {
                        fetch('/api/admin/auto_next', { method: 'POST' });
                        timeRemaining = 999; 
                    }
                }
            }
        }, 1000);

        async function confirmResetGame() {
            if (confirm("האם אתה בטוח שברצונך להפעיל מחדש את המשחק והניקוד?")) {
                await fetch('/api/admin/reset', { method: 'POST' });
                fetchGameState();
            }
        }

        // ניהול מקשים משופר לפי הבקשה: חיצים קדימה/אחורה, רווח לעצירה, מקש R להפעלה מחדש
        window.addEventListener('keydown', async (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                await fetch('/api/admin/pause', { method: 'POST' }); 
            }
            else if (event.code === 'ArrowRight') {
                event.preventDefault();
                await fetch('/api/admin/auto_next', { method: 'POST' });
            }
            else if (event.code === 'ArrowLeft') {
                event.preventDefault();
                await fetch('/api/admin/prev', { method: 'POST' });
            }
            else if (event.code === 'KeyR' || event.key === 'r' || event.key === 'R' || event.key === 'ר') {
                event.preventDefault();
                confirmResetGame();
            }
        });

        async function fetchGameState() {
            try {
                const response = await fetch('/display');
                const data = await response.json();
                
                let isPoll = data.question && data.question.type === 'poll';
                if (data.question) {
                    currentQuestionAnswer = isPoll ? null : data.question.correct_answer;
                    document.getElementById('question-text').innerText = data.question.text;
                    document.getElementById('q-counter').innerText = isPoll ? "📊 סקר דעת קהל" : "שאלה " + (data.question_index + 1);
                    for(let i=1; i<=4; i++) { 
                        if (data.question.options[i-1]) {
                            document.getElementById(`opt-${i}`).innerText = data.question.options[i-1]; 
                        } else {
                            document.getElementById(`opt-${i}`).innerText = "...";
                        }
                    }
                }
                
                let currentAnswersCount = Object.keys(data.answers).length;
                let totalConnected = Object.keys(data.connected_players).length; 
                
                document.getElementById('player-count').innerText = currentAnswersCount;
                
                let counts = {"1":0, "2":0, "3":0, "4":0};
                Object.values(data.answers).forEach(ans => { if(ans.choice) counts[ans.choice]++; });
                
                for(let i=1; i<=4; i++) {
                    let pct = totalConnected === 0 ? 0 : Math.round((counts[i]/totalConnected)*100);
                    document.getElementById(`fill-${i}`).style.height = pct + '%';
                    document.getElementById(`pct-${i}`).innerText = pct + '%';
                }

                if (data.status === 'lobby') {
                    const players = Object.values(data.connected_players);
                    document.getElementById('lobby-count').innerText = players.length;
                    let html = '';
                    players.forEach(p => { html += `<div class="player-badge">${p}</div>`; });
                    document.getElementById('lobby-players').innerHTML = html;
                }

                if (data.status !== currentState) {
                    currentState = data.status;
                    handleStateChange(currentState, data);
                }
            } catch (error) {}
        }

        function handleStateChange(state, data) {
            const bgMusic = document.getElementById('bg-music');
            const beepSound = document.getElementById('beep-sound');
            const greenLight = document.getElementById('green-light');
            const redLight = document.getElementById('red-light');
            
            for(let i=1; i<=4; i++) { document.getElementById(`box-${i}`).classList.remove('correct-answer'); }
            
            document.getElementById('lobby-screen').style.display = (state === 'lobby') ? 'block' : 'none';
            document.getElementById('game-board').style.display = (state === 'active' || state === 'reveal' || state === 'pause') ? 'flex' : 'none';
            document.getElementById('global-leaderboard').style.display = (state === 'mid_leaderboard' || state === 'endgame') ? 'block' : 'none';
            document.getElementById('round-winners').style.display = (state === 'reveal') ? 'block' : 'none';

            // אם הסטטוס אינו 'השהיה', דואגים להסתיר את המסך השחור
            if (state !== 'pause') {
                isPaused = false;
                document.getElementById('pause-overlay').style.display = 'none';
            }

            if (state === 'active') {
                bgMusic.play().catch(e=>{});
                
                // אתחול השעון מחדש רק במעבר משאלה לשאלה (לא בביטול השהיה)
                if (timeRemaining === 0 || timeRemaining === 999) {
                    timeRemaining = 30;
                }
                
                document.getElementById('timer-display').innerText = timeRemaining;
                document.getElementById('timer-display').style.background = '#e81e3a';
                
                greenLight.classList.add('green-on');
                redLight.classList.remove('red-on');
            }
            else if (state === 'pause') {
                isPaused = true;
                bgMusic.pause();
                document.getElementById('pause-overlay').style.display = 'flex';
                
                // שמירה על האור הירוק דלוק גם כשהמשחק מושהה באמצע שאלה
                greenLight.classList.add('green-on');
                redLight.classList.remove('red-on');
            }
            else if (state === 'reveal') {
                bgMusic.pause(); bgMusic.currentTime = 0;
                beepSound.play().catch(e=>{});
                
                timeRemaining = 0;
                document.getElementById('timer-display').innerText = timeRemaining;
                document.getElementById('timer-display').style.background = '#2ecc71'; 
                
                greenLight.classList.remove('green-on');
                redLight.classList.add('red-on');
                
                let isPoll = data.question && data.question.type === 'poll';

                if (!isPoll && currentQuestionAnswer) {
                    document.getElementById(`box-${currentQuestionAnswer}`).classList.add('correct-answer');
                }
                
                if (isPoll) {
                    let winnersTitle = document.querySelector('#round-winners h3');
                    if (winnersTitle) winnersTitle.innerText = "📊 תוצאות הסקר 📊";
                    
                    let counts = {"1":0, "2":0, "3":0, "4":0};
                    let totalVotes = Object.keys(data.answers).length;
                    Object.values(data.answers).forEach(ans => { if (ans.choice) counts[ans.choice]++; });
                    
                    let maxVotes = -1;
                    let topChoice = 1;
                    for (let i = 1; i <= 4; i++) {
                        if (counts[i] > maxVotes) {
                            maxVotes = counts[i];
                            topChoice = i;
                        }
                    }

                    let html = '';
                    if (totalVotes === 0) {
                        html = '<span>אין הצבעות בסקר זה</span>';
                    } else {
                        let topOptText = (data.question && data.question.options && data.question.options[topChoice - 1]) ? data.question.options[topChoice - 1] : `אופציה ${topChoice}`;
                        let pct = Math.round((maxVotes / totalVotes) * 100);
                        html = `<span>🏆 האופציה המובילה: <strong>"${topOptText}"</strong> (${pct}% מההצבעות)</span>`;
                    }
                    document.getElementById('round-winners-list').innerHTML = html;
                } else {
                    let winnersTitle = document.querySelector('#round-winners h3');
                    if (winnersTitle) winnersTitle.innerText = "⚡ העונים המהירים ביותר בשאלה זו ⚡";
                    
                    let roundWinners = Object.values(data.answers).filter(a => a.correct).sort((a, b) => a.time - b.time).slice(0, 3);
                    let html = '';
                    const medals = ["🥇", "🥈", "🥉"];
                    roundWinners.forEach((w, i) => { html += `<span>${medals[i]} ${w.name} (${w.time.toFixed(1)} שניות)</span>`; });
                    if(html === '') html = '<span>אף אחד לא ענה נכון הפעם... </span>';
                    document.getElementById('round-winners-list').innerHTML = html;
                }
            }
            else if (state === 'mid_leaderboard' || state === 'endgame') {
                bgMusic.pause();
                timeRemaining = 0;
                document.getElementById('timer-display').innerText = timeRemaining;
                document.getElementById('gl-title').innerText = (state === 'endgame') ? "🏆 המנצחים הגדולים שיזכו בפרסים! 🏆" : "🏆 10 השחקנים המובילים בינתיים 🏆";
                
                greenLight.classList.remove('green-on');
                redLight.classList.add('red-on');
                
                let allScores = Object.values(data.global_scores).sort((a, b) => {
                    if(b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                
                let limit = (state === 'endgame') ? 3 : 10;
                let topList = allScores.slice(0, limit);
                
                let html = "<tr><th>מקום</th><th>שם המשתתף</th><th>תשובות נכונות</th></tr>";
                topList.forEach((s, i) => {
                    html += `<tr><td>#${i+1}</td><td>${s.name}</td><td>${s.score}</td></tr>`;
                });
                document.getElementById('gl-table').innerHTML = html;
            }
        }

        setInterval(fetchGameState, 500);
    </script>
</body>
</html>
